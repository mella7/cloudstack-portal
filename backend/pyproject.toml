[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["B008", "S101", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
